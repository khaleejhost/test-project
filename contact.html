<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Testing Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h1 class="logo">Testing Project</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h2>Contact Us</h2>
            <p>Koi sawal ya feedback ho to neeche form fill karein.</p>

            <form class="contact-form" action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Apna naam likhein" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Apna email likhein" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Apna message likhein" required></textarea>

                <button type="submit" class="btn">Send Message</button>
            </form>

            <a href="index.html" class="btn">Home</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Testing Project. All rights reserved.</p>
    </footer>
</body>
</html>
